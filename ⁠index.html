<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيران الغدير - المحالة</title>
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <header class="app-header">
        <h1>🏘️ جيران الغدير</h1>
        <div class="header-controls">
            <button id="admin-btn" onclick="openAdminLogin()" title="لوحة المدير">🔐 المدير</button>
            <div id="weather-temp" style="cursor: pointer;" title="الطقس">--°C</div>
        </div>
    </header>

    <main class="container">
        <!-- شاشة تسجيل دخول المدير (مخفية حتى يتم طلبها) -->
        <div id="admin-login-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <h3>🔐 تسجيل دخول المدير</h3>
                <label>اختر الاسم:</label>
                <select id="admin-select-name">
                    <option value="عامر معيض القحطاني">عامر معيض القحطاني</option>
                </select>
                <label>الرقم السري:</label>
                <input type="password" id="admin-pass-input" placeholder="أدخل الرقم السري">
                <button onclick="verifyAdminLogin()" class="btn-primary">دخول لوحة التحكم</button>
                <button onclick="closeAdminLogin()" class="btn-secondary">إلغاء</button>
            </div>
        </div>

        <!-- لوحة تحكم المدير (تظهر عند النجاح) -->
        <div id="admin-dashboard" class="card" style="display:none; border: 2px solid #1b4d3e;">
            <h2>🛠️ لوحة تحكم المدير (صلاحيات كاملة)</h2>
            <div class="admin-actions">
                <button onclick="manageMembers()">👥 إدارة الجيران والأرقام السرية</button>
                <button onclick="manageSchedules()">🗓️ تعديل جداول القهوة والطلعات</button>
                <button onclick="backupData()">💾 حفظ نسخة احتياطية</button>
                <button onclick="restoreData()">↩️ استعادة البرنامج</button>
                <button onclick="closeAdminDashboard()" style="background:#c0392b; color:white;">إغلاق اللوحة</button>
            </div>
        </div>

        <!-- الأقسام الرئيسية -->
        <section class="grid-menu">
            <div class="menu-item" onclick="openSection('neighbors')">👥 الجيران</div>
            <div class="menu-item" onclick="openSection('schedules')">☕ السرى والطلعات</div>
            <div class="menu-item" onclick="openSection('community')">🤝 مجتمع الجيران</div>
            <div class="menu-item" onclick="openSection('services')">🏘️ خدمات الحي</div>
            <div class="menu-item" onclick="openSection('sports')">⚽ الرياضة</div>
            <div class="menu-item" onclick="openSection('mosque')">🕌 جامع ابن ذعار</div>
            <div class="menu-item" onclick="openSection('weather')">🌡️ الطقس</div>
            <div class="menu-item" onclick="openSection('quran')">📖 القرآن والأذكار</div>
        </section>

        <!-- عرض محتوى الأقسام الديناميكي -->
        <section id="dynamic-content-area" class="card" style="margin-top: 15px;">
            <h2>☕ سرى القهوة والطلعات (نشط)</h2>
            <div id="trips-schedule-container">
                <p>جاري تحميل البيانات من قاعدة البيانات...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
