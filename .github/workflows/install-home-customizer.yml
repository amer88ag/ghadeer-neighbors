name: Install home customizer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install launcher
        shell: bash
        run: |
          set -e
          grep -Fq "home-customizer.js?v=20260930" enhancements.js || printf "\n(function(){var s=document.createElement('script');s.src='home-customizer.js?v=20260930';s.defer=false;document.head.appendChild(s);})();\n" >> enhancements.js
          rm -f .github/workflows/install-home-customizer.yml .home-customizer-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enhancements.js .github/workflows/install-home-customizer.yml .home-customizer-trigger
          git commit -m "chore: install home customizer"
          git push
