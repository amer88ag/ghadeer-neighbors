name: Verify Ghadeer production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 20
      - name: Verify Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          url="https://ghadeer-neighbors.amer88ag.workers.dev/"
          ok=0
          for attempt in {1..30}; do
            echo "Checking $url (attempt $attempt/30)"
            body="$(curl -LfsS --max-time 20 "$url" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Eq 'جيران حي الغدير|ghadeer-neighbors'; then
              echo "PASS: Cloudflare production"
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "FAIL: Cloudflare production did not expose the expected Ghadeer application"
            exit 1
          fi

  vercel-when-available:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel verification is intentionally deferred until the platform build-rate limit is cleared."
