name: Build Ghadeer frontend assets
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - build.js
      - enhancements.js
      - quran-enhancement.js
      - runtime-fix.js
      - services-enhancement.js
      - rental-enhancement.js
      - neighbor-connect.js
      - outing-events-enhancement.js
      - production-fixes.js
      - production-bridge.js
      - jobs-realestate-enhancement.js
      - ui-final-fix.js
      - pin-recovery.js
      - member-session.js
      - neighborhood-news-ticker.js
      - notification-settings.js
      - .github/workflows/load-enhancements.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required frontend files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html', 'app.js', 'build.js', 'enhancements.js',
              'quran-enhancement.js', 'runtime-fix.js',
              'services-enhancement.js', 'rental-enhancement.js',
              'neighbor-connect.js', 'outing-events-enhancement.js',
              'production-fixes.js', 'production-bridge.js',
              'jobs-realestate-enhancement.js', 'ui-final-fix.js',
              'pin-recovery.js', 'member-session.js',
              'neighborhood-news-ticker.js', 'notification-settings.js'
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          print('Ghadeer frontend asset validation passed.')
          PY
      - name: Validate JavaScript syntax
        run: |
          for f in app.js build.js enhancements.js quran-enhancement.js runtime-fix.js services-enhancement.js rental-enhancement.js neighbor-connect.js outing-events-enhancement.js production-fixes.js production-bridge.js jobs-realestate-enhancement.js ui-final-fix.js pin-recovery.js member-session.js neighborhood-news-ticker.js notification-settings.js; do
            node --check "$f"
          done
      - name: Materialize production build output
        run: node build.js
      - name: Validate local script references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          required_scripts = [
              'app.js', 'enhancements.js', 'quran-enhancement.js',
              'runtime-fix.js', 'services-enhancement.js',
              'rental-enhancement.js', 'neighbor-connect.js',
              'outing-events-enhancement.js', 'production-fixes.js',
              'production-bridge.js', 'jobs-realestate-enhancement.js',
              'ui-final-fix.js', 'pin-recovery.js', 'member-session.js',
              'neighborhood-news-ticker.js', 'notification-settings.js'
          ]
          missing = [s for s in required_scripts if s not in html]
          if missing:
              raise SystemExit('Missing script references after build: ' + ', '.join(missing))
          local_src = re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', html)
          missing_files = []
          for src in local_src:
              src = src.split('?',1)[0]
              if src.startswith(('http://','https://','//')):
                  continue
              if not Path(src).is_file():
                  missing_files.append(src)
          if missing_files:
              raise SystemExit('Missing local script files: ' + ', '.join(sorted(set(missing_files))))
          print('Build/reference validation passed.')
          PY
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: materialize frontend enhancement scripts'
          git push
