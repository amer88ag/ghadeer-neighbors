name: Validate Ghadeer frontend assets
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - enhancements.js
      - quran-enhancement.js
      - runtime-fix.js
      - services-enhancement.js
      - rental-enhancement.js
      - neighbor-connect.js
      - build.js
      - vercel.json
      - .github/workflows/load-enhancements.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required frontend files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html', 'app.js', 'build.js', 'enhancements.js',
              'quran-enhancement.js', 'runtime-fix.js',
              'services-enhancement.js', 'rental-enhancement.js',
              'neighbor-connect.js', 'vercel.json'
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          print('Ghadeer frontend asset validation passed.')
          PY
