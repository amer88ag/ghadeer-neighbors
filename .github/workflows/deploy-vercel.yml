name: Ghadeer Vercel release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production build
        run: |
          node build.js
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/runtime-hardening.js

      - name: Validate Vercel configuration
        run: |
          test -f vercel.json
          node -e "const c=require('./vercel.json'); if(c.buildCommand!=='node build.js') process.exit(1); if(c.outputDirectory!=='.') process.exit(1); console.log('Vercel configuration: PASS')"

      - name: Deployment mode
        run: |
          echo "Vercel production deployment is kept on the connected Vercel↔GitHub integration."
          echo "The release gate validates the shared artifact without requiring a stored CLI token."
