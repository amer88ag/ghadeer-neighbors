name: Ghadeer Vercel release gate

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository release audit
        run: node scripts/release-audit.js

      - name: Validate production build
        run: |
          node build.js
          test -f dist/index.html
          test -f dist/app.js

      - name: Validate Vercel configuration
        run: |
          test -f vercel.json
          node -e "const c=require('./vercel.json'); if(c.buildCommand!=='node build.js') process.exit(1); if(c.outputDirectory!=='dist') process.exit(1); console.log('Vercel configuration: PASS')"

      - name: Deployment mode
        run: |
          echo "Validation only. Production deployment is intentionally manual and is not triggered by this workflow."
