name: Ghadeer Vercel release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production build
        run: node build.js

      - name: Validate Vercel configuration
        run: |
          test -f vercel.json
          node -e "const c=require('./vercel.json'); if(c.buildCommand!=='node build.js') process.exit(1); if(c.outputDirectory!=='.') process.exit(1); console.log('Vercel configuration: PASS')"

      - name: Deployment mode
        run: |
          echo "Vercel deployment is kept on the connected Vercel↔GitHub Production integration."
          echo "This workflow is a release gate only, so missing CLI secrets cannot create a false failed deployment."
