name: Deploy Ghadeer to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production build
        run: node build.js

      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing Cloudflare API token secret. Expected CLOUDFLARE_API_TOKEN (or legacy CF_API_TOKEN)."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing Cloudflare account ID secret. Expected CLOUDFLARE_ACCOUNT_ID (or legacy CF_ACCOUNT_ID)."; exit 1; }

      - name: Deploy to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy . --project-name=ghadeer-neighbors
