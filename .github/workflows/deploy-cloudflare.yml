name: Ghadeer Cloudflare release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production build
        run: node build.js

      - name: Validate Cloudflare configuration
        run: |
          test -f wrangler.toml
          grep -q '^name = "ghadeer-neighbors"' wrangler.toml
          grep -q '^pages_build_output_dir = "."' wrangler.toml
          echo "Cloudflare configuration: PASS"

      - name: Deployment mode
        run: |
          echo "Cloudflare deployment is kept on the connected Cloudflare↔GitHub Production integration."
          echo "This workflow is a release gate only, so missing CLI secrets cannot create a false failed deployment."
