name: Ghadeer Cloudflare release gate

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository release audit
        run: node scripts/release-audit.js

      - name: Validate production build
        env:
          GHADEER_BUILD_INJECT: "1"
        run: |
          node build.js
          test -f dist/index.html
          test -f dist/app.js

      - name: Validate Cloudflare Worker configuration
        run: |
          test -f wrangler.toml
          test -f worker.js
          grep -q '^name = "ghadeer-neighbors"' wrangler.toml
          grep -q '^main = "worker.js"' wrangler.toml
          grep -q '^directory = "./dist"' wrangler.toml
          echo "Cloudflare Worker static-assets configuration: PASS"

      - name: Deployment mode
        run: |
          echo "Validation only. Production deployment is intentionally manual and is not triggered by this workflow."
